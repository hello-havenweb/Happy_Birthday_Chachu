<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Special Birthday Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="password-page" class="page active">
        <div class="password-container">
            <h1>🎁 You Have a Surprise!</h1>
            <p>Enter the secret code to unlock</p>
            <input type="password" id="password-input" placeholder="Enter password" maxlength="20">
            <button id="unlock-btn">Unlock 🔓</button>
            <p id="password-error" class="error"></p>
        </div>
    </div>

    <div id="envelope-page" class="page">
        <div class="envelope-wrapper">
            <div class="envelope" id="envelope">
                <div class="flap"></div>
                <div class="body"></div>
                <div class="letter" id="letter">
                    <p>🎉 Click to Open! 🎉</p>
                </div>
            </div>
            <p class="hint">Tap the envelope!</p>
        </div>
    </div>

    <div id="birthday-page" class="page">
        <canvas id="confetti-canvas"></canvas>
        
        <div class="content">
            <h1 class="birthday-title">🎂 Happy Birthday! 🎂</h1>
            <p class="birthday-message">Wishing you the most amazing day filled with love and joy!</p>
            
            <div class="cake-container">
                <div class="cake">
                    <div class="candle"></div>
                    <div class="candle"></div>
                    <div class="candle"></div>
                    <div class="flame"></div>
                    <div class="flame"></div>
                    <div class="flame"></div>
                </div>
            </div>

            <div class="gifts">
                <div class="gift" data-message="May all your dreams come true! ✨">
                    <div class="gift-box">🎁</div>
                </div>
                <div class="gift" data-message="You deserve all the happiness! 💖">
                    <div class="gift-box">🎁</div>
                </div>
                <div class="gift" data-message="Cheers to another amazing year! 🥳">
                    <div class="gift-box">🎁</div>
                </div>
            </div>

            <div id="gift-message" class="gift-message"></div>

            <div class="music-player">
                <button id="music-toggle">🎵 Play Music</button>
                <audio id="birthday-song" loop>
                    <source src="assets/happy-birthday.mp3" type="audio/mpeg">
                </audio>
            </div>

            <button id="replay-btn" class="replay-btn">🔄 Replay Animation</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
